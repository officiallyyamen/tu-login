<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TU Login 2FA</title>
<style>
  :root { --ink:#1b2233; --soft:#5d6578; --line:#d9dde6; --accent:#006699; --bg:#f6f7f9; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:520px; margin:48px auto; padding:0 16px; display:grid; gap:16px; }
  h1 { font-size:22px; margin:0; }
  p { margin:0; color:var(--soft); }
  label { display:grid; gap:6px; font-weight:600; }
  input[type=password], input[type=text] { font:15px ui-monospace, Consolas, monospace; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
  .row { display:flex; gap:8px; align-items:center; font-weight:400; }
  button { justify-self:start; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  #status { min-height:1.5em; font-weight:600; }
  #code { font:28px ui-monospace, Consolas, monospace; letter-spacing:.15em; }
</style>
</head>
<body>
<main>
  <h1>TU Login 2FA</h1>
  <p>Deine TU-Zugangsdaten. Sie bleiben nur in diesem Chrome-Profil gespeichert und werden nicht mit deinem Google-Konto synchronisiert.</p>
  <label>Matrikelnummer / Benutzername
    <input id="username" type="text" autocomplete="off" spellcheck="false">
  </label>
  <label>Passwort
    <input id="password" type="password" autocomplete="off">
  </label>
  <label>2FA-Schlüssel (Base32)
    <input id="secret" type="password" autocomplete="off" spellcheck="false" placeholder="JBSWY3DPEHPK3PXP…">
  </label>
  <label class="row"><input id="auto" type="checkbox"> Nach dem Ausfüllen automatisch anmelden</label>
  <button id="save">Speichern</button>
  <div id="status"></div>
  <p>Aktueller Code zum Vergleich mit deiner Authenticator-App: <span id="code">——————</span></p>
</main>
<script src="totp.js"></script>
<script src="options.js"></script>
</body>
</html>
